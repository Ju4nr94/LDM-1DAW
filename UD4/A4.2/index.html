<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Formulario de registro</title>
    </head>
    <body>
        <h1>Formulario de registro</h1>
        <form action="" id="form">
            <label for="name">Nombre:</label>
            <input type="text" name="name" id="name" maxlength="50"><br><br>
            <label for="lname">Apellidos:</label>
            <input type="text" name="lname" id="lname" maxlength="50"><br><br>
            <label for="gender">Género:</label>
            <label for="masc">Masculino</label>
            <input type="radio" name="gender" id="masc" value="Hombre">
            <label for="fem">Femenino</label>
            <input type="radio" name="gender" id="fem" value="Mujer"><br><br>
            <label for="email">Email:</label>
            <input type="text" name="email" id="email"><br><br>
            <label for="from">Población:</label>
            <select name="from" id="from">
                <option value="null" selected>Selecciona</option>
                <option value="Alicante">Alicante</option>
                <option value="Madrid">Madrid</option>
                <option value="Sevilla">Sevilla</option>
                <option value="Valencia">Valencia</option>
            </select><br><br>
            <label for="des">Descripción</label>
            <textarea name="des" id="des" rows="10" cols="30"></textarea><br><br>
            <label for="ads">Deseo recibir información sobre novedades y ofertas</label>
            <input type="checkbox" name="ads" id="ads" checked><br><br>
            <label for="terms">Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre protección de datos</label>
            <input type="checkbox" name="terms" id="terms"><br><br>
            <input type="submit" name="submit" id="submit">
        </form>
        <p id="mensajeError"></p>
        <script src="./script.js"></script>
    </body>
</html>
