<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <head>
        <title>Formulario de registro</title>
    </head>
    <body>
        <h1>Formulario de registro</h1>
        <form action="">
            <label for="fname">Nombre:</label>
            <input type="text" name="name" id="name" maxlength="50" required><br><br>
            <label for="lname">Apellidos:</label>
            <input type="text" name="lname" id="lname" maxlength="50" required><br><br>
            <label for="sex">Sexo:</label>
            <label for="masc">Hombre</label>
            <input type="radio" name="sex" id="masc" value="Hombre" required>
            <label for="fem">Mujer</label>
            <input input type="radio" name="sex" id="fem" value="Mujer" required><br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email"><br><br>
            <label for="from">Población:</label>
            <select name="from" id="from">
                <option value="Alicante">Alicante</option>
                <option value="Madrid">Madrid</option>
                <option value="Sevilla">Sevilla</option>
                <option value="Valencia">Valencia</option>
            </select><br><br>
            <label for="des">Descripción</label>
            <textarea name="des" id="des" rows="10" cols="30"></textarea><br><br>
            <label for="ads">Deseo recibir información sobre novedades y ofertas</label>
            <input type="checkbox" name="ads" id="ads" checked><br><br>
            <label for="terms">Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre protección de datos</label>
            <input type="checkbox" name="terms" id="terms" required><br><br>
            <input type="submit" name="submit" id="submit">
        </form>
    </body>
</html>
